name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test unified runner
        run: python3 skills/agent-cli-workers/tests/test_agent_worker.py
      - name: Test Grok compatibility entry point
        run: python3 skills/grok-build-cli/tests/test_grok_worker.py
      - name: Test controller observations
        run: python3 tests/test_controller_observation.py
      - name: Check public tree
        run: python3 tests/test_public_tree.py
